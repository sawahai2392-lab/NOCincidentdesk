services:
  postgres:
    image: postgres:18.6
    container_name: noc-incident-desk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocdesk
      POSTGRES_USER: nocdesk
      POSTGRES_PASSWORD: nocdesk_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nocdesk-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocdesk -d nocdesk"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  nocdesk-postgres-data:
